# The merge gate from CLAUDE.md §6, run on every PR and every push to main:
# typecheck, lint, production build, then the full Playwright suite (desktop +
# mobile) against the production server — the same build Vercel serves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # 1340 Playwright tests ran in ~17 min on the runner (Oct 2026); with install,
    # build and browser setup the old 30-minute cap cut a green run short.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Vercel project's runtime
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

      # The browser download alone once took 13 minutes on the runner; cache it
      # per lockfile and only fetch the system libraries on a hit.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Start production server
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          npx --yes wait-on --timeout 60000 http://localhost:3000/
      - name: Playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next-start.log
          retention-days: 7
